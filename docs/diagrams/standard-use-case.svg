<svg xmlns="http://www.w3.org/2000/svg" width="1550" height="1580" viewBox="0 0 1550 1580" role="img" aria-labelledby="title"><title id="title">Restaurant UML Use Case Diagram</title><defs><marker id="open-arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1L10 6L1 11" fill="none" stroke="black" stroke-width="1.2"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif" fill="black"><text x="775" y="35" text-anchor="middle" font-size="22"><tspan x="775" dy="0">Restaurant Management System — UML Use Case Diagram</tspan></text><rect x="235" y="85" width="1080" height="1395" fill="none" stroke="black" stroke-width="1.5"/><text x="775" y="115" text-anchor="middle" font-size="17"><tspan x="775" dy="0">Restaurant Management System</tspan></text><polyline points="125,225 205,225 205,185 305,185" fill="none" stroke="black" stroke-width="1.1"/><polyline points="125,225 205,225 205,295 305,295" fill="none" stroke="black" stroke-width="1.1"/><polyline points="125,675 205,675 205,295 305,295" fill="none" stroke="black" stroke-width="1.1"/><polyline points="125,225 205,225 205,405 305,405" fill="none" stroke="black" stroke-width="1.1"/><polyline points="125,675 205,675 205,550 305,550" fill="none" stroke="black" stroke-width="1.1"/><polyline points="125,675 205,675 205,660 305,660" fill="none" stroke="black" stroke-width="1.1"/><polyline points="125,675 205,675 205,770 305,770" fill="none" stroke="black" stroke-width="1.1"/><polyline points="125,675 205,675 205,880 305,880" fill="none" stroke="black" stroke-width="1.1"/><polyline points="1425,640 1340,640 1340,480 1245,480" fill="none" stroke="black" stroke-width="1.1"/><polyline points="1425,640 1340,640 1340,590 1245,590" fill="none" stroke="black" stroke-width="1.1"/><polyline points="1425,640 1340,640 1340,700 1245,700" fill="none" stroke="black" stroke-width="1.1"/><polyline points="1425,640 1340,640 1340,810 1245,810" fill="none" stroke="black" stroke-width="1.1"/><polyline points="1425,920 1340,920 1340,935 1245,935" fill="none" stroke="black" stroke-width="1.1"/><polyline points="1425,920 1340,920 1340,1045 1245,1045" fill="none" stroke="black" stroke-width="1.1"/><polyline points="125,1175 205,1175 205,1060 305,1060" fill="none" stroke="black" stroke-width="1.1"/><polyline points="125,1175 205,1175 205,1170 305,1170" fill="none" stroke="black" stroke-width="1.1"/><polyline points="125,1175 205,1175 205,1280 305,1280" fill="none" stroke="black" stroke-width="1.1"/><polyline points="125,1175 205,1175 205,1390 305,1390" fill="none" stroke="black" stroke-width="1.1"/><polyline points="1425,1260 1340,1260 1340,1170 1245,1170" fill="none" stroke="black" stroke-width="1.1"/><polyline points="125,1175 205,1175 205,1510 1340,1510 1340,1170 1245,1170" fill="none" stroke="black" stroke-width="1.1"/><polyline points="1425,1260 1340,1260 1340,1280 1245,1280" fill="none" stroke="black" stroke-width="1.1"/><polyline points="1425,1260 1340,1260 1340,1390 1245,1390" fill="none" stroke="black" stroke-width="1.1"/><polyline points="1425,640 1340,640 1340,1390 1245,1390" fill="none" stroke="black" stroke-width="1.1"/><polyline points="575,295 655,295" fill="none" stroke="black" stroke-dasharray="7 4" marker-end="url(#open-arrow)"/><text x="615" y="283" text-anchor="middle" font-size="12"><tspan x="615" dy="0">«include»</tspan></text><polyline points="925,295 975,295" fill="none" stroke="black" stroke-dasharray="7 4" marker-end="url(#open-arrow)"/><text x="950" y="283" text-anchor="middle" font-size="12"><tspan x="950" dy="0">«include»</tspan></text><ellipse cx="440" cy="185" rx="135" ry="35" fill="white" stroke="black" stroke-width="1.3"/><text x="440" y="190" text-anchor="middle" font-size="14"><tspan x="440" dy="0">Browse Available Menu</tspan></text><ellipse cx="440" cy="295" rx="135" ry="35" fill="white" stroke="black" stroke-width="1.3"/><text x="440" y="300" text-anchor="middle" font-size="14"><tspan x="440" dy="0">Submit Order (QR / POS)</tspan></text><ellipse cx="440" cy="405" rx="135" ry="35" fill="white" stroke="black" stroke-width="1.3"/><text x="440" y="410" text-anchor="middle" font-size="14"><tspan x="440" dy="0">Track Order Progress</tspan></text><ellipse cx="790" cy="295" rx="135" ry="35" fill="white" stroke="black" stroke-width="1.3"/><text x="790" y="300" text-anchor="middle" font-size="14"><tspan x="790" dy="0">Validate Order</tspan></text><ellipse cx="1110" cy="295" rx="135" ry="35" fill="white" stroke="black" stroke-width="1.3"/><text x="1110" y="300" text-anchor="middle" font-size="14"><tspan x="1110" dy="0">Reserve Required Stock</tspan></text><ellipse cx="440" cy="550" rx="135" ry="35" fill="white" stroke="black" stroke-width="1.3"/><text x="440" y="555" text-anchor="middle" font-size="14"><tspan x="440" dy="0">Manage Table Visit</tspan></text><ellipse cx="440" cy="660" rx="135" ry="35" fill="white" stroke="black" stroke-width="1.3"/><text x="440" y="665" text-anchor="middle" font-size="14"><tspan x="440" dy="0">Receive QR / Ready Alerts</tspan></text><ellipse cx="440" cy="770" rx="135" ry="35" fill="white" stroke="black" stroke-width="1.3"/><text x="440" y="775" text-anchor="middle" font-size="14"><tspan x="440" dy="0">Mark Items Served</tspan></text><ellipse cx="440" cy="880" rx="135" ry="35" fill="white" stroke="black" stroke-width="1.3"/><text x="440" y="885" text-anchor="middle" font-size="14"><tspan x="440" dy="0">View / Hand Over Bill</tspan></text><ellipse cx="1110" cy="480" rx="135" ry="35" fill="white" stroke="black" stroke-width="1.3"/><text x="1110" y="485" text-anchor="middle" font-size="14"><tspan x="1110" dy="0">View Kitchen Tickets</tspan></text><ellipse cx="1110" cy="590" rx="135" ry="35" fill="white" stroke="black" stroke-width="1.3"/><text x="1110" y="595" text-anchor="middle" font-size="14"><tspan x="1110" dy="0">Start Preparation</tspan></text><ellipse cx="1110" cy="700" rx="135" ry="35" fill="white" stroke="black" stroke-width="1.3"/><text x="1110" y="705" text-anchor="middle" font-size="14"><tspan x="1110" dy="0">Mark Items Ready</tspan></text><ellipse cx="1110" cy="810" rx="135" ry="35" fill="white" stroke="black" stroke-width="1.3"/><text x="1110" y="815" text-anchor="middle" font-size="14"><tspan x="1110" dy="0">Record Prepared Batch</tspan></text><ellipse cx="1110" cy="935" rx="135" ry="35" fill="white" stroke="black" stroke-width="1.3"/><text x="1110" y="940" text-anchor="middle" font-size="14"><tspan x="1110" dy="0">Review Calculated Bill</tspan></text><ellipse cx="1110" cy="1045" rx="135" ry="35" fill="white" stroke="black" stroke-width="1.3"/><text x="1110" y="1050" text-anchor="middle" font-size="14"><tspan x="1110" dy="0">Confirm External Settlement</tspan></text><ellipse cx="440" cy="1060" rx="135" ry="35" fill="white" stroke="black" stroke-width="1.3"/><text x="440" y="1065" text-anchor="middle" font-size="14"><tspan x="440" dy="0">Assign Zones / Table Limits</tspan></text><ellipse cx="440" cy="1170" rx="135" ry="35" fill="white" stroke="black" stroke-width="1.3"/><text x="440" y="1175" text-anchor="middle" font-size="14"><tspan x="440" dy="0">Manage Menu and Recipes</tspan></text><ellipse cx="440" cy="1280" rx="135" ry="35" fill="white" stroke="black" stroke-width="1.3"/><text x="440" y="1276" text-anchor="middle" font-size="14"><tspan x="440" dy="0">Analyze Restaurant</tspan><tspan x="440" dy="18">Operations</tspan></text><ellipse cx="440" cy="1390" rx="135" ry="35" fill="white" stroke="black" stroke-width="1.3"/><text x="440" y="1395" text-anchor="middle" font-size="14"><tspan x="440" dy="0">Configure Batch Module</tspan></text><ellipse cx="1110" cy="1170" rx="135" ry="35" fill="white" stroke="black" stroke-width="1.3"/><text x="1110" y="1175" text-anchor="middle" font-size="14"><tspan x="1110" dy="0">Manage Suppliers</tspan></text><ellipse cx="1110" cy="1280" rx="135" ry="35" fill="white" stroke="black" stroke-width="1.3"/><text x="1110" y="1285" text-anchor="middle" font-size="14"><tspan x="1110" dy="0">Record Receipts and Issues</tspan></text><ellipse cx="1110" cy="1390" rx="135" ry="35" fill="white" stroke="black" stroke-width="1.3"/><text x="1110" y="1395" text-anchor="middle" font-size="14"><tspan x="1110" dy="0">Record Counts and Waste</tspan></text><circle cx="100" cy="196" r="13" fill="white" stroke="black" stroke-width="1.5"/><path d="M100 209v36m-25 -22h50m-25 22l-24 30m24 -30l24 30" fill="none" stroke="black" stroke-width="1.5"/><text x="100" y="299" text-anchor="middle" font-size="15"><tspan x="100" dy="0">Customer</tspan></text><circle cx="100" cy="646" r="13" fill="white" stroke="black" stroke-width="1.5"/><path d="M100 659v36m-25 -22h50m-25 22l-24 30m24 -30l24 30" fill="none" stroke="black" stroke-width="1.5"/><text x="100" y="749" text-anchor="middle" font-size="15"><tspan x="100" dy="0">Waiter</tspan></text><circle cx="100" cy="1146" r="13" fill="white" stroke="black" stroke-width="1.5"/><path d="M100 1159v36m-25 -22h50m-25 22l-24 30m24 -30l24 30" fill="none" stroke="black" stroke-width="1.5"/><text x="100" y="1249" text-anchor="middle" font-size="15"><tspan x="100" dy="0">Manager</tspan></text><circle cx="1450" cy="611" r="13" fill="white" stroke="black" stroke-width="1.5"/><path d="M1450 624v36m-25 -22h50m-25 22l-24 30m24 -30l24 30" fill="none" stroke="black" stroke-width="1.5"/><text x="1450" y="714" text-anchor="middle" font-size="15"><tspan x="1450" dy="0">Chef</tspan></text><circle cx="1450" cy="891" r="13" fill="white" stroke="black" stroke-width="1.5"/><path d="M1450 904v36m-25 -22h50m-25 22l-24 30m24 -30l24 30" fill="none" stroke="black" stroke-width="1.5"/><text x="1450" y="994" text-anchor="middle" font-size="15"><tspan x="1450" dy="0">Cashier</tspan></text><circle cx="1450" cy="1231" r="13" fill="white" stroke="black" stroke-width="1.5"/><path d="M1450 1244v36m-25 -22h50m-25 22l-24 30m24 -30l24 30" fill="none" stroke="black" stroke-width="1.5"/><text x="1450" y="1334" text-anchor="middle" font-size="15"><tspan x="1450" dy="0">Inventory Staff</tspan></text><path d="M605 160h635l15 15v70h-650z M1240 160v15h15" fill="white" stroke="black"/><text x="617" y="182" text-anchor="start" font-size="13"><tspan x="617" dy="0">Online only. QR acceptance sends tickets directly to kitchen.</tspan><tspan x="617" dy="18">Notify the assigned zone waiter; no waiter approval.</tspan><tspan x="617" dy="18">Cashier handles payment outside this system.</tspan></text><path d="M640 840h310l15 15v75h-325z M950 840v15h15" fill="white" stroke="black"/><text x="652" y="862" text-anchor="start" font-size="13"><tspan x="652" dy="0">Prepared batch: optional; disabled by default.</tspan><tspan x="652" dy="18">Shown as a conditional capability, not an «extend»</tspan><tspan x="652" dy="18">relationship to ordering.</tspan></text><text x="775" y="1550" text-anchor="middle" font-size="14"><tspan x="775" dy="0">Associations = actor participation. «include» = required behavior. This diagram does not show task sequence.</tspan></text></g></svg>
